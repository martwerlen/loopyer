<!doctype html>
<html lang="en">
<head>
    
    <!-- META -->
	<title>LOOPY (v2.0)</title>
    <meta content="text/html;charset=utf-8" http-equiv="Content-Type">
	<meta charset="utf-8">
	<link rel="icon" type="image/png" href="css/icons/favicon.png">
	<!-- mobile don't randomly zoom -->
	<meta name='viewport' content='width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0'/>
	<!-- Schema.org markup for Google+ -->
	<meta itemprop="name" content="LOOPY!">
	<meta itemprop="description" content="a tool for thinking in systems">
	<meta itemprop="image" content="http://ncase.me/loopy/social/thumbnail.png">

	<!-- Twitter Card data: SMALL -->
	<meta name="twitter:card" content="summary"/>
	<meta name="twitter:site" content="@ncasenmare"/>
	<meta name="twitter:title" content="LOOPY!"/>
	<meta name="twitter:description" content="a tool for thinking in systems"/>
	<meta name="twitter:creator" content="@ncasenmare">
	<meta name="twitter:image" content="http://ncase.me/loopy/social/thumbnail_small.png"/>

	<!-- Open Graph data -->
	<meta property="og:title" content="LOOPY!">
	<meta property="og:type" content="website">
	<meta property="og:url" content="https://lo0p.it/">
	<meta property="og:image" content="http://ncase.me/loopy/social/thumbnail.png">
	<meta property="og:description" content="a tool for thinking in systems">

    <!-- Styles! -->
	<link href="css/loopy.css" rel="stylesheet"/>
	<link href="css/balloon.css" rel="stylesheet"/>

</head>
<body style="opacity:0">

	<!-- Loopy & Ink -->
	<div id="canvasses"></div>

	<!-- The Tools' UI -->
	<div id="toolbar"></div>
	<div id="playbar"></div>
	<div id="sidebar"></div>

	<!-- Interface d'enregistrement GIF - À ajouter dans le body de index.html -->
	<div class="gif-controls">
		<div class="gif-main-controls">
			<button id="gif-record-btn" class="gif-record-btn" title="Démarrer/Arrêter l'enregistrement GIF">
				🔴 Enregistrer vidéo
			</button>
			<button id="gif-settings-btn" class="gif-record-btn" style="background: #4444ff; font-size: 12px;" title="Configurer les paramètres d'enregistrement">
				⚙️ Options
			</button>
		</div>
		
		<div id="gif-status" class="gif-status" title="État actuel de l'enregistrement">
			Prêt à enregistrer
		</div>
		
		<div id="gif-settings" class="gif-settings">
			<!-- Le contenu sera généré par JavaScript -->
		</div>
	</div>

	<!-- MODAL -->
	<div id="modal_container">
		<div id="modal_bg"></div>
		<div id="modal">
			<div id="modal_close">[×] CLOSE</div>
			<div id="modal_page"></div>
		</div>
	</div>

</body>
</html>
